# Render Blueprint for Synapse AI Knowledge Platform
# 100% Free Tier Compatible (750 free compute hours/mo)
services:
  - type: web
    name: synapse-ai-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
